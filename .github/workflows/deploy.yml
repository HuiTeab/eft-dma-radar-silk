name: Deploy to GitHub Releases

on:
  push:
    branches:
      - beta
      - main
    paths:
      - 'Resources/**'
      - 'Maps/**'
      - 'src-silk/**'
      - 'lib/**'
      - 'version.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Deploy
    if: github.repository_owner == 'HuiTeab'
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version info
        uses: dotnet/nbgv@master
        id: nbgv

      - name: Determine release channel
        id: channel
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $baseVersion = "${{ steps.nbgv.outputs.SemVer2 }}"

          if ($branch -eq "beta") {
            $version = "$baseVersion-beta"
            $tag = "v$baseVersion-beta"
            $releaseName = "EFT $baseVersion-beta (Pre-release)"
            $prerelease = "true"
            $channel = "beta"
          } else {
            $version = "$baseVersion"
            $tag = "v$baseVersion"
            $releaseName = "EFT $baseVersion"
            $prerelease = "false"
            $channel = "stable"
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT
          "RELEASE_NAME=$releaseName" >> $env:GITHUB_OUTPUT
          "PRERELEASE=$prerelease" >> $env:GITHUB_OUTPUT
          "CHANNEL=$channel" >> $env:GITHUB_OUTPUT

          Write-Host "Branch: $branch"
          Write-Host "Version: $version"
          Write-Host "Channel: $channel"
          Write-Host "Pre-release: $prerelease"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Dotnet Publish (EFT)
        run: |
          dotnet publish src-silk/eft-dma-radar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:Version=${{ steps.channel.outputs.VERSION }} `
            -o out/eft

      - name: Clean publish output
        shell: pwsh
        run: |
          Remove-Item -Path "out\eft\*.pdb" -ErrorAction SilentlyContinue

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "out\eft\*" -DestinationPath "eft-dma-radar.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TAG: ${{ steps.channel.outputs.TAG }}
          GH_RELEASE_NAME: ${{ steps.channel.outputs.RELEASE_NAME }}
          GH_PRERELEASE: ${{ steps.channel.outputs.PRERELEASE }}
          GH_SHA: ${{ github.sha }}
          GH_NOTES: ${{ github.event.head_commit.message }}
        run: |
          $flags = @(
            $env:GH_TAG
            "eft-dma-radar.zip"
            "--title", $env:GH_RELEASE_NAME
            "--target", $env:GH_SHA
            "--notes", $env:GH_NOTES
          )
          if ($env:GH_PRERELEASE -eq "true") {
            $flags += "--prerelease"
          } else {
            $flags += "--latest"
          }
          gh release create @flags
